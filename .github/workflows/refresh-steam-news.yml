name: Refresh Steam news and publish website

# Refresh the live site every six hours without a local computer running.
# A failed feed fetch or test leaves the previous deployment intact.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the approved site
        uses: actions/checkout@v6
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch the latest official English announcements
        run: pnpm run sync:news
      - name: Check the renewed site
        run: pnpm run test:renewal
      - name: Build the static website
        run: pnpm exec vite build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Publish the refreshed feed
        id: deployment
        uses: actions/deploy-pages@v5
